# Same jobs I ran on GitLab at work: install, Chromium, e2e + api, catalog check, JUnit.
# This file is original. It is not copied from an employer pipeline.

stages: [test]

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  PLAYWRIGHT_BROWSERS_PATH: '$CI_PROJECT_DIR/.pw-browsers'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - .pw-browsers/

playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  script:
    - npm ci
    - npm test
    - npm run price-check
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
    reports:
      junit: test-results/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
